<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Supervision &amp; Bilans SuperAdmin — Kermesse Love and Charity</title>
  
  <link rel="stylesheet" href="css/style.css?v=7.1">
  <link rel="stylesheet" href="css/responsive.css?v=7.1">
  <link rel="stylesheet" href="css/portal.css?v=7.1">
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --active-pole-color: #0f172a;
    }
  </style>
</head>
<body class="pole-page-body">

  <!-- En-tête Navigation Supérieure Dédiée Supervision -->
  <header class="pole-nav-header">
    <div class="pole-nav-left">
      <a href="index.html" class="btn-hub-back" title="Menu Général">
        <span class="hub-back-arrow">←</span><span class="hub-back-text">Menu Général</span>
      </a>
      <div class="pole-title-group">
        <span class="pole-main-badge-icon">👑</span>
        <div>
          <h2>Supervision &amp; Direction Kermesse</h2>
          <span>Tableau de bord consolidé, bilans officiels et gestion des accès</span>
        </div>
      </div>
    </div>

    <div class="pole-nav-right">
      <div class="portal-user-badge">
        <span class="portal-avatar" style="background: #0f172a;">A</span>
        <div class="portal-user-info">
          <span class="portal-user-name" id="headerUserName">SuperAdmin</span>
          <span class="portal-user-role" id="headerUserRole" style="color: #dc2626;">SuperAdmin</span>
        </div>
      </div>
      <a href="messages.html" class="btn btn-secondary btn-sm" title="Messagerie &amp; Consignes" style="padding: 0.4rem 0.75rem;">
        <span>💬</span>
      </a>
      <a href="tasks.html" class="btn btn-secondary btn-sm" title="Mes Tâches &amp; Bloc-Notes" style="padding: 0.4rem 0.75rem;">
        <span>📝</span>
      </a>
      <button id="headerResetTestsBtn" class="btn btn-danger btn-sm" onclick="window.confirmResetAllData ? window.confirmResetAllData() : DashboardModule.confirmResetAllData()" title="Remettre à zéro toutes les données de test (SuperAdmin)" style="background: #dc2626; border: 1px solid #b91c1c; font-weight: 800; padding: 0.4rem 0.75rem; color: white;">
        <span>⚠️ Reset Tests</span>
      </button>
    </div>
  </header>

  <!-- Barre d'onglets spacieuse Supervision -->
  <nav class="pole-tabs-bar">
    <button class="pole-tab-btn active" data-tab="dashboard" onclick="PoleApp.switchTab('dashboard')">
      <span>📊</span> Tableau de Bord Global
    </button>
    <button class="pole-tab-btn" data-tab="caisse_bilan" onclick="PoleApp.switchTab('caisse_bilan')">
      <span>💰</span> Bilan Financier Consolidé
    </button>
    <button class="pole-tab-btn" data-tab="roles" onclick="PoleApp.switchTab('roles')">
      <span>👥</span> Rôles &amp; Comptes
    </button>
    <button class="pole-tab-btn" data-tab="history" onclick="PoleApp.switchTab('history')">
      <span>📜</span> Journal d'Activité
    </button>
    <button class="pole-tab-btn" data-tab="reports" onclick="PoleApp.switchTab('reports')">
      <span>📑</span> Rapports Officiels
    </button>
    <button class="pole-tab-btn" data-tab="caisse_annulations" onclick="PoleApp.switchTab('caisse_annulations')">
      <span>🗑️</span> Registre des Annulations
    </button>
  </nav>

  <!-- Zone de Contenu Plein Écran Spacieux -->
  <main class="pole-content-wrapper" id="poleContainer">
    <div style="text-align: center; padding: 3rem; color: var(--gray-500);">
      Chargement de l'espace Supervision...
    </div>
  </main>

  <!-- Toast Notification Container -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- Scripts Core -->
  <script src="js/config.js?v=7.1"></script>
  <script src="js/notify.js?v=7.1"></script>
  <script src="js/supabase.js?v=7.1"></script>
  <script src="js/audit.js?v=7.1"></script>
  <script src="js/offline.js?v=7.1"></script>
  <script src="js/auth.js?v=7.1"></script>
  <script src="js/permissions.js?v=7.1"></script>

  <!-- Modules Supervision -->
  <script src="js/modules/dashboard.js?v=7.1"></script>
  <script src="js/modules/caisses.js?v=7.1"></script>
  <script src="js/modules/roles.js?v=7.1"></script>
  <script src="js/modules/history.js?v=7.1"></script>
  <script src="js/modules/reports.js?v=7.1"></script>

  <!-- Contrôleur de Page Supervision -->
  <script>
    const PoleApp = {
      currentTab: 'dashboard',
      tabs: {
        dashboard: { label: 'Tableau de bord', handler: DashboardModule },
        caisse_bilan: { label: 'Bilan Financier', handler: CaisseBilanModule },
        roles: { label: 'Rôles & Comptes', handler: RolesModule },
        history: { label: 'Journal', handler: HistoryModule },
        reports: { label: 'Rapports', handler: ReportsModule },
        caisse_annulations: { label: 'Registre des Annulations', handler: CaisseAnnulationsModule }
      },

      async init() {
        if (!Auth.requireAuth()) return;
        SupabaseClient.init();
        OfflineManager.init();

        const user = Auth.getCurrentUser();
        if (user) {
          document.getElementById('headerUserName').textContent = user.full_name || user.login;
          document.getElementById('headerUserRole').textContent = user.role_name || user.role_code || 'SuperAdmin';
        }

        // Contrôle des autorisations d'accès : Réservé exclusivement au SuperAdmin
        await Permissions.syncPolesFromCloud();
        if (!Permissions.isSuperAdmin()) {
          const resetBtn = document.getElementById('headerResetTestsBtn');
          if (resetBtn) resetBtn.style.display = 'none';
          const navTabs = document.querySelector('.pole-tabs-bar');
          if (navTabs) navTabs.style.display = 'none';
          document.getElementById('poleContainer').innerHTML = `
            <div class="card" style="text-align: center; padding: 3rem 1.5rem; max-width: 520px; margin: 3rem auto; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.08); border-radius: 16px;">
              <div style="font-size: 3.5rem; margin-bottom: 1rem;">🔒</div>
              <h3 style="font-weight: 800; color: #1e293b; font-size: 1.35rem; margin-bottom: 0.75rem;">Accès Réservé au SuperAdmin</h3>
              <p style="color: #64748b; margin-bottom: 1.5rem; line-height: 1.6; font-size: 0.95rem;">
                Le module de <strong>Supervision Générale &amp; Bilan Consolidé</strong> est strictement réservé au SuperAdministrateur.
                <br>Veuillez utiliser votre compte SuperAdmin pour y accéder.
              </p>
              <a href="index.html" class="btn btn-primary" style="display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.75rem 1.5rem; font-weight: 600;">
                <span>←</span> Retour au Menu Général
              </a>
            </div>
          `;
          return;
        }

        const hash = window.location.hash.replace('#', '');
        if (hash && this.tabs[hash]) {
          this.switchTab(hash);
        } else {
          this.switchTab('dashboard');
        }

        window.addEventListener('hashchange', () => {
          const newHash = window.location.hash.replace('#', '');
          if (newHash && this.tabs[newHash] && newHash !== this.currentTab) {
            this.switchTab(newHash);
          }
        });
      },

      switchTab(tabId) {
        if (!this.tabs[tabId]) return;
        this.currentTab = tabId;
        window.location.hash = tabId;

        document.querySelectorAll('.pole-tab-btn').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.tab === tabId);
        });

        const container = document.getElementById('poleContainer');
        container.innerHTML = '<div style="text-align: center; padding: 2.5rem; color: var(--gray-500);">Chargement...</div>';
        
        try {
          this.tabs[tabId].handler.render(container);
        } catch (e) {
          console.error('[Pole Tab Render Error]', e);
          container.innerHTML = `<div class="alert-banner danger">Erreur lors de l\'affichage : ${e.message}</div>`;
        }
      },

      navigateTo(moduleName) {
        if (this.tabs[moduleName]) {
          this.switchTab(moduleName);
        } else {
          const map = {
            communication: 'pole1-communication.html',
            tickets: 'pole2-caisses.html#caisse_jeux',
            cash: 'pole2-caisses.html#caisse_entree',
            caisse_entree: 'pole2-caisses.html#caisse_entree',
            caisse_jeux: 'pole2-caisses.html#caisse_jeux',
            caisse_jetons: 'pole2-caisses.html#caisse_jetons',
            caisse_bilan: 'pole2-caisses.html#caisse_bilan',
            decoration: 'pole3-organisation.html#decoration',
            locations: 'pole3-organisation.html#locations',
            caisse_restauration: 'pole4-restauration.html#caisse_restauration',
            stocks: 'pole4-restauration.html#stocks',
            inventory: 'pole4-restauration.html#inventory',
            stands: 'pole5-stands.html#stands',
            games: 'pole5-stands.html#games',
            gifts: 'pole6-lots.html#gifts',
            members: 'pole7-benevoles.html#members',
            teams: 'pole7-benevoles.html#teams',
            materials: 'pole8-materiel.html#materials',
            loans: 'pole8-materiel.html#loans',
            movements: 'pole8-materiel.html#movements',
            returns: 'pole8-materiel.html#returns',
            security: 'pole9-securite.html#security',
            incidents: 'pole9-securite.html#incidents',
            messages: 'messages.html',
            tasks: 'tasks.html'
          };
          if (map[moduleName]) {
            window.location.href = map[moduleName];
          } else {
            window.location.href = `index.html#${moduleName}`;
          }
        }
      }
    };

    window.App = PoleApp;
    window.PoleApp = PoleApp;
    if (document.readyState === 'loading') {
      window.addEventListener('DOMContentLoaded', () => PoleApp.init());
    } else {
      PoleApp.init();
    }
  </script>
</body>
</html>
