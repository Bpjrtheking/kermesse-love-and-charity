<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Pôle 9 : Accueil &amp; Sécurité — Kermesse Love and Charity</title>
  
  <link rel="stylesheet" href="css/style.css?v=6.7">
  <link rel="stylesheet" href="css/responsive.css?v=6.7">
  <link rel="stylesheet" href="css/portal.css?v=6.7">
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --active-pole-color: #e11d48;
    }
  </style>
</head>
<body class="pole-page-body">

  <!-- En-tête Navigation Supérieure Dédiée Pôle 9 -->
  <header class="pole-nav-header">
    <div class="pole-nav-left">
      <a href="index.html" class="btn-hub-back" title="Menu Général">
        <span class="hub-back-arrow">←</span><span class="hub-back-text">Menu Général</span>
      </a>
      <div class="pole-title-group">
        <span class="pole-main-badge-icon">🛡️</span>
        <div>
          <h2>Pôle 9 : Accueil &amp; Sécurité</h2>
          <span>Poste de secours, sécurité, propreté, objets trouvés et registre d'incidents</span>
        </div>
      </div>
    </div>

    <div class="pole-nav-right">
      <div class="portal-user-badge">
        <span class="portal-avatar" style="background: #e11d48;">S</span>
        <div class="portal-user-info">
          <span class="portal-user-name" id="headerUserName">Chargement...</span>
          <span class="portal-user-role" id="headerUserRole" style="color: #e11d48;">Sécurité</span>
        </div>
      </div>
      <a href="messages.html" class="btn btn-secondary btn-sm" title="Messagerie &amp; Consignes" style="padding: 0.4rem 0.75rem;">
        <span>💬</span>
      </a>
      <a href="tasks.html" class="btn btn-secondary btn-sm" title="Mes Tâches &amp; Bloc-Notes" style="padding: 0.4rem 0.75rem;">
        <span>📝</span>
      </a>
    </div>
  </header>

  <!-- Barre d'onglets spacieuse Pôle 9 -->
  <nav class="pole-tabs-bar">
    <button class="pole-tab-btn active" data-tab="security" onclick="PoleApp.switchTab('security')">
      <span>🛡️</span> Accueil, Secours &amp; Propreté
    </button>
    <button class="pole-tab-btn" data-tab="incidents" onclick="PoleApp.switchTab('incidents')">
      <span>⚠️</span> Registre des Incidents
    </button>
  </nav>

  <!-- Zone de Contenu Plein Écran Spacieux -->
  <main class="pole-content-wrapper" id="poleContainer">
    <div style="text-align: center; padding: 3rem; color: var(--gray-500);">
      Chargement du Pôle Sécurité...
    </div>
  </main>

  <!-- Toast Notification Container -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- Scripts Core -->
  <script src="js/config.js?v=6.7"></script>
  <script src="js/notify.js?v=6.7"></script>
  <script src="js/supabase.js?v=6.7"></script>
  <script src="js/audit.js?v=6.7"></script>
  <script src="js/offline.js?v=6.7"></script>
  <script src="js/auth.js?v=6.7"></script>
  <script src="js/permissions.js?v=6.7"></script>

  <!-- Modules Pôle 9 -->
  <script src="js/modules/security.js?v=6.7"></script>
  <script src="js/modules/incidents.js?v=6.7"></script>

  <!-- Contrôleur de Page Pôle 9 -->
  <script>
    const PoleApp = {
      currentTab: 'security',
      tabs: {
        security: { label: 'Sécurité & Secours', handler: SecurityModule },
        incidents: { label: 'Registre Incidents', handler: IncidentsModule }
      },

      async init() {
        if (!Auth.requireAuth()) return;
        SupabaseClient.init();
        OfflineManager.init();

        const user = Auth.getCurrentUser();
        if (user) {
          document.getElementById('headerUserName').textContent = user.full_name || user.login;
          document.getElementById('headerUserRole').textContent = user.role_name || user.role_code || 'Sécurité';
        }

        // Contrôle des autorisations d'accès au Pôle
        await Permissions.syncPolesFromCloud();
        if (!Permissions.canAccessPole(9)) {
          const navTabs = document.querySelector('.pole-tabs-bar');
          if (navTabs) navTabs.style.display = 'none';
          document.getElementById('poleContainer').innerHTML = `
            <div class="card" style="text-align: center; padding: 3rem 1.5rem; max-width: 520px; margin: 3rem auto; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.08); border-radius: 16px;">
              <div style="font-size: 3.5rem; margin-bottom: 1rem;">🔒</div>
              <h3 style="font-weight: 800; color: #1e293b; font-size: 1.35rem; margin-bottom: 0.75rem;">Accès Non Autorisé</h3>
              <p style="color: #64748b; margin-bottom: 1.5rem; line-height: 1.6; font-size: 0.95rem;">
                Votre compte n'a pas reçu la permission d'accéder au <strong>Pôle 9 : Accueil, Secours &amp; Sécurité</strong>.
                <br>Pour obtenir l'accès, veuillez demander à un <strong>SuperAdministrateur</strong> d'ajouter ce pôle à votre profil.
              </p>
              <a href="index.html" class="btn btn-primary" style="display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.75rem 1.5rem; font-weight: 600;">
                <span>←</span> Retour au Menu Général
              </a>
            </div>
          `;
          return;
        }

        const hash = window.location.hash.replace('#', '');
        if (hash && this.tabs[hash]) {
          this.switchTab(hash);
        } else {
          this.switchTab('security');
        }

        window.addEventListener('hashchange', () => {
          const newHash = window.location.hash.replace('#', '');
          if (newHash && this.tabs[newHash] && newHash !== this.currentTab) {
            this.switchTab(newHash);
          }
        });
      },

      switchTab(tabId) {
        if (!this.tabs[tabId]) return;
        this.currentTab = tabId;
        window.location.hash = tabId;

        document.querySelectorAll('.pole-tab-btn').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.tab === tabId);
        });

        const container = document.getElementById('poleContainer');
        container.innerHTML = '<div style="text-align: center; padding: 2.5rem; color: var(--gray-500);">Chargement...</div>';
        
        try {
          this.tabs[tabId].handler.render(container);
        } catch (e) {
          console.error('[Pole Tab Render Error]', e);
          container.innerHTML = `<div class="alert-banner danger">Erreur lors de l\'affichage : ${e.message}</div>`;
        }
      },

      navigateTo(moduleName) {
        if (this.tabs[moduleName]) {
          this.switchTab(moduleName);
        } else {
          window.location.href = `index.html#${moduleName}`;
        }
      }
    };

    window.App = PoleApp;
    window.PoleApp = PoleApp;
    if (document.readyState === 'loading') {
      window.addEventListener('DOMContentLoaded', () => PoleApp.init());
    } else {
      PoleApp.init();
    }
  </script>
</body>
</html>
