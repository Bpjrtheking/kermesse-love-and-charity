<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- Cache Control (Anti-Cache Mobile & GitHub Pages) -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Connexion — Love and Charity (L&amp;C) | Gestion de Kermesse</title>
  
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <link rel="apple-touch-icon" href="assets/logo.svg">
  <link rel="stylesheet" href="css/style.css?v=5.8">
  <link rel="stylesheet" href="css/responsive.css?v=5.8">
  
  <!-- Supabase JS Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* ==============================================================
       SPLASH SCREEN STYLES (EXPÉRIENCE CINÉMATIQUE AAA NATIVE APP)
       ============================================================== */
    .app-splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      z-index: 999999;
      background: radial-gradient(circle at 50% 38%, #1e112a 0%, #0d0f1f 42%, #030712 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      box-sizing: border-box;
      overflow: hidden;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      transition: opacity 0.55s cubic-bezier(0.4, 0, 0.2, 1), transform 0.55s cubic-bezier(0.4, 0, 0.2, 1), filter 0.55s ease;
    }

    /* Canvas des particules / braises flottantes */
    #splashCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    /* Halo ambiant néon multicolore */
    .splash-ambient-glow {
      position: absolute;
      width: 440px;
      height: 440px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(220, 38, 38, 0.3) 0%, rgba(245, 158, 11, 0.14) 40%, transparent 70%);
      top: 38%;
      left: 50%;
      transform: translate(-50%, -50%);
      filter: blur(55px);
      pointer-events: none;
      z-index: 2;
      animation: ambientPulse 3.5s ease-in-out infinite alternate;
    }

    @keyframes ambientPulse {
      0% { transform: translate(-50%, -50%) scale(0.85); opacity: 0.6; }
      100% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
    }

    .splash-content {
      position: relative;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 380px;
      width: 100%;
    }

    /* Conteneur d'icône avec orbite et ondes sonar */
    .splash-icon-wrapper {
      position: relative;
      width: 124px;
      height: 124px;
      margin-bottom: 1.85rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Onde sonar 1 */
    .splash-ring {
      position: absolute;
      inset: -14px;
      border-radius: 42px;
      border: 2px solid rgba(239, 68, 68, 0.35);
      animation: splashRingExpand 2.6s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
      pointer-events: none;
    }

    /* Onde sonar 2 */
    .splash-ring.ring-2 {
      animation-delay: 0.9s;
      border-color: rgba(245, 158, 11, 0.3);
    }

    @keyframes splashRingExpand {
      0% { transform: scale(0.82); opacity: 0.9; }
      100% { transform: scale(1.52); opacity: 0; }
    }

    /* Anneau orbital avec comète rotative */
    .splash-orbit {
      position: absolute;
      width: 152px;
      height: 152px;
      border-radius: 50%;
      border: 1px dashed rgba(239, 68, 68, 0.25);
      animation: orbitRotate 3.6s linear infinite;
      pointer-events: none;
    }

    .splash-orbit::after {
      content: '';
      position: absolute;
      top: -4px;
      left: 50%;
      transform: translateX(-50%);
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #f97316;
      box-shadow: 0 0 14px #ef4444, 0 0 24px #f59e0b;
    }

    @keyframes orbitRotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Icône App Apple/Google en squircle haute définition */
    .splash-app-icon {
      width: 104px;
      height: 104px;
      background: linear-gradient(145deg, #ffffff 0%, #f1f5f9 100%);
      border-radius: 28px;
      box-shadow: 
        0 25px 60px -10px rgba(220, 38, 38, 0.65), 
        0 0 40px rgba(239, 68, 68, 0.4), 
        inset 0 2px 4px rgba(255, 255, 255, 0.95),
        inset 0 -2px 6px rgba(0, 0, 0, 0.06);
      border: 1.5px solid rgba(255, 255, 255, 0.6);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 13px;
      box-sizing: border-box;
      animation: splashIconEntrance 0.85s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes splashIconEntrance {
      0% { opacity: 0; transform: scale(0.4) translateY(36px) rotate(-6deg); }
      70% { transform: scale(1.08) translateY(-4px) rotate(1deg); }
      100% { opacity: 1; transform: scale(1) translateY(0) rotate(0deg); }
    }

    /* Reflet laser traversant l'icône */
    .splash-app-icon::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -100%;
      width: 200%;
      height: 200%;
      background: linear-gradient(
        115deg,
        transparent 0%,
        rgba(255, 255, 255, 0) 35%,
        rgba(255, 255, 255, 0.8) 50%,
        rgba(255, 255, 255, 0) 65%,
        transparent 100%
      );
      transform: rotate(25deg);
      animation: iconShimmer 2.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    @keyframes iconShimmer {
      0% { transform: translateX(-120%) rotate(25deg); }
      40%, 100% { transform: translateX(120%) rotate(25deg); }
    }

    .splash-logo-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      position: relative;
      z-index: 1;
    }

    /* Typographie & Titre Cinématique */
    .splash-text-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      width: 100%;
    }

    .splash-app-title {
      font-size: 1.65rem;
      font-weight: 900;
      letter-spacing: 0.16em;
      margin: 0 0 0.35rem 0;
      background: linear-gradient(180deg, #ffffff 40%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 14px rgba(239, 68, 68, 0.45));
      animation: splashFadeUp 0.65s 0.2s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .splash-app-subtitle {
      font-size: 0.84rem;
      font-weight: 600;
      color: #94a3b8;
      margin: 0 0 1.15rem 0;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      animation: splashFadeUp 0.65s 0.3s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .splash-edition-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #f1f5f9;
      padding: 0.35rem 1rem;
      border-radius: 9999px;
      font-size: 0.76rem;
      font-weight: 700;
      margin-bottom: 2.15rem;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
      animation: splashFadeUp 0.65s 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .splash-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 10px #10b981;
      animation: dotPulse 1.5s ease-in-out infinite alternate;
    }

    @keyframes dotPulse {
      0% { transform: scale(0.9); opacity: 0.7; }
      100% { transform: scale(1.3); opacity: 1; }
    }

    /* Chargeur HUD & Barre de Progression */
    .splash-loader-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 230px;
      animation: splashFadeUp 0.65s 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .splash-loader-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      margin-bottom: 0.5rem;
    }

    .splash-status-lbl {
      font-size: 0.72rem;
      font-weight: 700;
      color: #94a3b8;
      letter-spacing: 0.03em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 180px;
      transition: color 0.3s ease;
    }

    .splash-percentage-lbl {
      font-size: 0.76rem;
      font-weight: 900;
      color: #ef4444;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.05em;
      text-shadow: 0 0 10px rgba(239, 68, 68, 0.6);
    }

    .splash-progress-track {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 9999px;
      overflow: hidden;
      position: relative;
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.5);
    }

    .splash-progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #dc2626 0%, #f97316 55%, #ef4444 100%);
      border-radius: 9999px;
      box-shadow: 0 0 16px rgba(239, 68, 68, 0.95);
      transition: width 0.12s linear;
    }

    /* Bouton d'omission rapide (Skip) */
    .splash-skip-btn {
      position: absolute;
      bottom: 2.2rem;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.45rem 1rem;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #94a3b8;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      cursor: pointer;
      transition: all 0.2s ease;
      z-index: 4;
      animation: splashFadeUp 0.65s 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .splash-skip-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.25);
    }

    @keyframes splashFadeUp {
      0% { opacity: 0; transform: translateY(18px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* ==============================================================
       ÉCRAN ET FORMULAIRE DE CONNEXION (TRANSITION SOYEUSE)
       ============================================================== */
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      padding: 1.25rem;
      margin: 0;
      box-sizing: border-box;
      -webkit-text-size-adjust: 100%;
    }

    .login-card {
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 420px;
      padding: 2.25rem 1.75rem;
      text-align: center;
      box-sizing: border-box;
      opacity: 0;
      transform: translateY(32px) scale(0.96);
      transition: opacity 0.55s cubic-bezier(0.16, 1, 0.3, 1), transform 0.55s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }

    .login-card.is-revealed {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    .login-logo {
      width: 85px;
      height: 85px;
      margin: 0 auto 1rem auto;
      object-fit: contain;
      filter: drop-shadow(0 4px 10px rgba(220, 38, 38, 0.2));
    }

    .login-title {
      font-size: 1.35rem;
      font-weight: 800;
      color: #0f172a;
      line-height: 1.2;
      margin-bottom: 0.25rem;
    }

    .login-subtitle {
      font-size: 0.82rem;
      color: var(--primary, #dc2626);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 1.75rem;
    }

    .login-form {
      text-align: left;
    }

    .login-form .form-group {
      margin-bottom: 1.15rem;
    }

    .login-form label {
      font-size: 0.85rem;
      font-weight: 700;
      color: #334155;
      margin-bottom: 0.4rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .login-form .form-control {
      width: 100%;
      padding: 0.75rem 1rem;
      font-size: 16px !important; /* Règle anti-zoom iOS Safari */
      border: 1.5px solid #cbd5e1;
      border-radius: 12px;
      background: #f8fafc;
      transition: all 0.2s ease;
      box-sizing: border-box;
    }

    .login-form .form-control:focus {
      background: #ffffff;
      border-color: var(--primary, #dc2626);
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.15);
      outline: none;
    }

    .password-input-wrapper {
      position: relative;
      width: 100%;
    }

    .password-input-wrapper .form-control {
      padding-right: 46px;
    }

    .btn-toggle-pwd {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      font-size: 1.15rem;
      cursor: pointer;
      color: #64748b;
      padding: 6px 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-btn {
      width: 100%;
      padding: 0.85rem;
      font-size: 1rem;
      font-weight: 700;
      margin-top: 0.75rem;
      border-radius: 12px;
      letter-spacing: 0.02em;
      background: var(--primary, #dc2626);
      color: #ffffff;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(220, 38, 38, 0.35);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      min-height: 48px;
    }

    .login-btn:hover {
      background: #b91c1c;
      transform: translateY(-1px);
    }

    .login-btn:disabled {
      background: #94a3b8;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .login-footer {
      margin-top: 1.75rem;
      padding-top: 1rem;
      border-top: 1px solid #e2e8f0;
      font-size: 0.76rem;
      color: #64748b;
      line-height: 1.4;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- ==============================================================
       SPLASH SCREEN NATIVE WEB APP LAUNCHER (3.2S CINÉMATIQUE)
       ============================================================== -->
  <div id="appSplashScreen" class="app-splash-screen" onclick="skipSplash(event)">
    <!-- Canvas des micro-particules lumineuses -->
    <canvas id="splashCanvas"></canvas>

    <!-- Lueur néon ambiante -->
    <div class="splash-ambient-glow"></div>

    <div class="splash-content">
      <!-- Icône App Native en Squircle avec Anneaux d'Onde & Orbite -->
      <div class="splash-icon-wrapper">
        <div class="splash-ring ring-1"></div>
        <div class="splash-ring ring-2"></div>
        <div class="splash-orbit"></div>
        <div class="splash-app-icon">
          <img src="assets/logo.svg" alt="Love &amp; Charity" class="splash-logo-img">
        </div>
      </div>

      <!-- Marque & Identité Visuelle -->
      <div class="splash-text-group">
        <h1 class="splash-app-title">LOVE &amp; CHARITY</h1>
        <p class="splash-app-subtitle">Gestion &amp; Contrôle de Kermesse</p>
        
        <div class="splash-edition-pill">
          <span class="splash-dot"></span>
          <span>Édition 2026 • Portail Opérationnel</span>
        </div>
      </div>

      <!-- Chargeur HUD avec Statut & Pourcentage en Temps Réel -->
      <div class="splash-loader-wrap">
        <div class="splash-loader-top">
          <span class="splash-status-lbl" id="splashStatusLbl">⚡ Initialisation du noyau...</span>
          <span class="splash-percentage-lbl" id="splashPercentageLbl">0%</span>
        </div>
        <div class="splash-progress-track">
          <div class="splash-progress-fill" id="splashProgressFill"></div>
        </div>
      </div>
    </div>

    <!-- Bouton pour passer rapidement -->
    <button type="button" class="splash-skip-btn" onclick="skipSplash(event)">
      <span>Passer l'animation</span>
      <span>✕</span>
    </button>
  </div>

  <!-- ==============================================================
       CARTE DE CONNEXION PRINCIPALE
       ============================================================== -->
  <div class="login-card">
    <img src="assets/logo.svg" alt="Love and Charity Logo" class="login-logo">
    <h1 class="login-title">Love &amp; Charity</h1>
    <div class="login-subtitle">Gestion &amp; Contrôle de Kermesse</div>

    <form class="login-form" id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="loginInput">
          <span>👤</span> Identifiant
        </label>
        <input 
          type="text" 
          id="loginInput" 
          class="form-control" 
          placeholder="Entrez votre identifiant" 
          required 
          autocomplete="username">
      </div>

      <div class="form-group">
        <label for="passwordInput">
          <span>🔒</span> Mot de passe
        </label>
        <div class="password-input-wrapper">
          <input 
            type="password" 
            id="passwordInput" 
            class="form-control" 
            placeholder="Entrez votre mot de passe" 
            required 
            autocomplete="current-password">
          <button type="button" class="btn-toggle-pwd" onclick="togglePasswordVisibility()" title="Afficher/Masquer le mot de passe">
            👁️
          </button>
        </div>
      </div>

      <button type="submit" class="login-btn" id="submitBtn">
        <span>🔐</span> Se connecter
      </button>

      <div id="loginError" style="color: var(--danger, #dc2626); font-size: 0.85rem; font-weight: 600; text-align: center; margin-top: 1rem; display: none; background: #fee2e2; padding: 0.6rem 0.75rem; border-radius: 8px;"></div>
    </form>

    <div class="login-footer">
      Plateforme officielle réservée aux organisateurs de la <strong>Kermesse Love and Charity</strong>
    </div>
  </div>

  <div id="toastContainer" class="toast-container"></div>

  <!-- Scripts Core -->
  <script src="js/config.js?v=5.8"></script>
  <script src="js/notify.js?v=5.8"></script>
  <script src="js/supabase.js?v=5.8"></script>
  <script src="js/audit.js?v=5.8"></script>
  <script src="js/offline.js?v=5.8"></script>
  <script src="js/auth.js?v=5.8"></script>

  <script>
    let splashClosed = false;

    // Fermeture fluide de l'animation Splash Screen et affichage du formulaire
    function finishSplash() {
      if (splashClosed) return;
      splashClosed = true;

      const splash = document.getElementById('appSplashScreen');
      const loginCard = document.querySelector('.login-card');

      if (splash) {
        splash.style.opacity = '0';
        splash.style.transform = 'scale(1.1)';
        splash.style.filter = 'blur(10px)';
        splash.style.pointerEvents = 'none';
        setTimeout(() => {
          splash.style.display = 'none';
        }, 550);
      }

      if (loginCard) {
        loginCard.classList.add('is-revealed');
        // Prise en main automatique du curseur dans le champ identifiant
        setTimeout(() => {
          const loginInp = document.getElementById('loginInput');
          if (loginInp && !loginInp.value) {
            loginInp.focus();
          }
        }, 300);
      }
    }

    // Permet de passer l'animation instantanément au toucher / clic
    window.skipSplash = function(e) {
      if (e) e.stopPropagation();
      finishSplash();
    };

    // Générateur de braises/particules lumineuses sur Canvas
    function initParticles() {
      const canvas = document.getElementById('splashCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let width = canvas.width = window.innerWidth;
      let height = canvas.height = window.innerHeight;

      const particles = [];
      const particleCount = 36;
      const colors = ['rgba(239, 68, 68, ', 'rgba(249, 115, 22, ', 'rgba(255, 255, 255, ', 'rgba(251, 191, 36, '];

      for (let i = 0; i < particleCount; i++) {
        particles.push({
          x: Math.random() * width,
          y: Math.random() * height,
          size: Math.random() * 2.2 + 0.8,
          speedY: Math.random() * 0.75 + 0.35,
          speedX: (Math.random() - 0.5) * 0.35,
          color: colors[Math.floor(Math.random() * colors.length)],
          alpha: Math.random() * 0.7 + 0.2
        });
      }

      function animate() {
        if (splashClosed) return;
        ctx.clearRect(0, 0, width, height);
        for (let p of particles) {
          p.y -= p.speedY;
          p.x += p.speedX;
          if (p.y < -10) {
            p.y = height + 10;
            p.x = Math.random() * width;
          }
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fillStyle = p.color + p.alpha + ')';
          ctx.shadowBlur = p.size * 3;
          ctx.shadowColor = p.color + '0.8)';
          ctx.fill();
        }
        requestAnimationFrame(animate);
      }
      animate();

      window.addEventListener('resize', () => {
        if (splashClosed) return;
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      SupabaseClient.init();

      // Vérifier si l'utilisateur est déjà connecté (sauf si mode preview)
      const urlParams = new URLSearchParams(window.location.search);
      const isPreview = urlParams.has('preview');
      const user = Auth.getCurrentUser();

      if (user && !isPreview) {
        const splash = document.getElementById('appSplashScreen');
        if (splash) splash.style.display = 'none';
        window.location.href = 'index.html';
        return;
      }

      // Lancement du canvas de particules
      initParticles();

      // Séquenceur d'initialisation en 4 étapes sur 3,2 secondes minimum
      const progressFill = document.getElementById('splashProgressFill');
      const percentageLbl = document.getElementById('splashPercentageLbl');
      const statusLbl = document.getElementById('splashStatusLbl');

      const totalDuration = 3200; // 3,2 secondes minimum
      const startTime = performance.now();

      // Étapes narratives de boot système
      const stages = [
        { progress: 28, text: '⚡ Initialisation du noyau...' },
        { progress: 65, text: '📊 Synchronisation des 9 Pôles & Caisses...' },
        { progress: 92, text: '🛡️ Sécurisation des terminaux...' },
        { progress: 100, text: '✨ Système prêt • Bienvenue !' }
      ];

      function updateLoader(now) {
        if (splashClosed) return;
        const elapsed = now - startTime;
        const ratio = Math.min(elapsed / totalDuration, 1);

        // Interpolation douce de la jauge (ease-in-out)
        const currentProgress = Math.round(ratio * 100);

        if (progressFill) progressFill.style.width = currentProgress + '%';
        if (percentageLbl) percentageLbl.textContent = currentProgress + '%';

        // Mise à jour narrative du statut
        if (statusLbl) {
          if (currentProgress < 30) {
            statusLbl.textContent = stages[0].text;
          } else if (currentProgress < 70) {
            statusLbl.textContent = stages[1].text;
          } else if (currentProgress < 95) {
            statusLbl.textContent = stages[2].text;
          } else {
            statusLbl.textContent = stages[3].text;
            statusLbl.style.color = '#38bdf8';
          }
        }

        if (ratio < 1) {
          requestAnimationFrame(updateLoader);
        } else {
          // Transition fluide vers la carte de connexion après complétion des 3,2 secondes
          setTimeout(() => {
            finishSplash();
          }, 250);
        }
      }

      requestAnimationFrame(updateLoader);

      // Failsafe de sécurité maximale (4,5 secondes)
      setTimeout(() => {
        finishSplash();
      }, 4500);
    });

    function togglePasswordVisibility() {
      const pwd = document.getElementById('passwordInput');
      if (pwd.type === 'password') {
        pwd.type = 'text';
      } else {
        pwd.type = 'password';
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const loginInput = document.getElementById('loginInput').value.trim();
      const passwordInput = document.getElementById('passwordInput').value;
      const btn = document.getElementById('submitBtn');
      const errBox = document.getElementById('loginError');

      errBox.style.display = 'none';
      btn.disabled = true;
      btn.innerHTML = '<span>⏳</span> Connexion en cours...';

      try {
        const result = await Auth.login(loginInput, passwordInput);
        if (result.success) {
          Notify.success('Connexion réussie !');
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 350);
        } else {
          errBox.textContent = result.message || 'Identifiant ou mot de passe incorrect.';
          errBox.style.display = 'block';
          btn.disabled = false;
          btn.innerHTML = '<span>🔐</span> Se connecter';
        }
      } catch (err) {
        errBox.textContent = 'Erreur: ' + (err.message || 'Impossible de se connecter.');
        errBox.style.display = 'block';
        btn.disabled = false;
        btn.innerHTML = '<span>🔐</span> Se connecter';
      }
    }
  </script>
</body>
