<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Messagerie &amp; Consignes d'Équipe — Kermesse Love and Charity</title>
  
  <link rel="stylesheet" href="css/style.css?v=5.8">
  <link rel="stylesheet" href="css/responsive.css?v=5.8">
  <link rel="stylesheet" href="css/portal.css?v=5.8">
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --active-pole-color: #0284c7;
    }
    .pole-content-wrapper.messages-wrapper {
      padding: 0.5rem 1rem 1rem 1rem;
      max-width: 1400px;
      margin: 0 auto;
      height: calc(100vh - 75px);
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
    }
    @media (max-width: 768px) {
      .pole-content-wrapper.messages-wrapper {
        padding: 0;
        height: calc(100vh - 65px);
      }
    }
  </style>
</head>
<body class="pole-page-body">

  <!-- En-tête Navigation Supérieure -->
  <header class="pole-nav-header">
    <div class="pole-nav-left">
      <a href="index.html" class="btn-hub-back">
        <span>←</span> Menu Général
      </a>
      <div class="pole-title-group">
        <span class="pole-main-badge-icon" style="background: #e0f2fe; color: #0284c7;">💬</span>
        <div>
          <h2>Messagerie &amp; Consignes d'Équipe</h2>
          <span>Canal Général, Alertes Urgentes &amp; Discussions directes (Accessible à tous)</span>
        </div>
      </div>
    </div>

    <div class="pole-nav-right">
      <div class="portal-user-badge">
        <span class="portal-avatar" style="background: #0284c7;" id="headerUserAvatar">U</span>
        <div class="portal-user-info">
          <span class="portal-user-name" id="headerUserName">Chargement...</span>
          <span class="portal-user-role" id="headerUserRole" style="color: #0284c7;">Admin</span>
        </div>
      </div>
      <a href="tasks.html" class="btn btn-secondary btn-sm" title="Mes Tâches &amp; Bloc-Notes" style="padding: 0.4rem 0.75rem;">
        <span>📝</span>
      </a>
      <button class="btn btn-secondary btn-sm" onclick="Auth.logout()" title="Déconnexion" style="padding: 0.4rem 0.75rem;">
        <span>🚪</span>
      </button>
    </div>
  </header>

  <!-- Zone de Contenu Plein Écran Spacieux pour la Messagerie -->
  <main class="pole-content-wrapper messages-wrapper" id="poleContainer">
    <div style="text-align: center; padding: 3rem; color: var(--gray-500);">
      Chargement de la messagerie instantanée...
    </div>
  </main>

  <!-- Toast Notification Container -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- Scripts Core -->
  <script src="js/config.js?v=5.8"></script>
  <script src="js/notify.js?v=5.8"></script>
  <script src="js/supabase.js?v=5.8"></script>
  <script src="js/audit.js?v=5.8"></script>
  <script src="js/offline.js?v=5.8"></script>
  <script src="js/auth.js?v=5.8"></script>
  <script src="js/permissions.js?v=5.8"></script>

  <!-- Module Messagerie -->
  <script src="js/modules/messages.js?v=5.8"></script>

  <!-- Contrôleur -->
  <script>
    const App = {
      currentModule: 'messages',
      init() {
        if (!Auth.requireAuth()) return;
        SupabaseClient.init();
        OfflineManager.init();

        const user = Auth.getCurrentUser();
        if (user) {
          document.getElementById('headerUserName').textContent = user.full_name || user.login;
          document.getElementById('headerUserRole').textContent = user.role_name || user.role_code || 'Admin';
          document.getElementById('headerUserAvatar').textContent = (user.login || 'U').charAt(0).toUpperCase();
        }

        const container = document.getElementById('poleContainer');
        MessagesModule.render(container);
        MessagesModule.startPolling();
      },
      navigateTo(moduleName) {
        window.location.href = `index.html#${moduleName}`;
      }
    };

    window.App = App;
    window.addEventListener('DOMContentLoaded', () => App.init());
  </script>
</body>
</html>
